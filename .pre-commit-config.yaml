exclude: ^src/configuration/database/migrations/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        exclude: ^scripts/bloom/wordlist/weak_passwords\.bloom$

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.0a3
    hooks:
      - id: isort
        args: ["--profile", "black"]
        stages: [pre-commit]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--max-line-length=88]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: docker-test-suite
        name: 🐳 Running Docker Test Suite (make ci)
        entry: make ci
        language: system
        pass_filenames: false
        stages: [pre-push]
