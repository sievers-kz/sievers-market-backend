- name: Техника
  attributes:
    - key: price
      label: Цена
      type: integer
      required: true
      filterable: true
      unit: null
      position: 0

    - key: currency
      label: Валюта
      type: enumerate
      required: true
      filterable: false
      unit: null
      options:
        - {key: KZT, label: KZT}
        - {key: RUB, label: RUB}
        - {key: USD, label: USD}
        - {key: EUR, label: EUR}
      position: 1

    - key: city
      label: Город
      type: reference
      required: true
      filterable: true
      unit: null
      source: cities
      position: 2

    - key: description
      label: Описание
      type: string
      required: false
      filterable: false
      unit: null
      position: 3

    - key: brand
      label: Марка
      type: reference
      required: true
      filterable: true
      unit: null
      source: brands
      position: 4

    - key: model
      label: Модель
      type: string
      required: false
      filterable: false
      unit: null
      position: 5

    - key: year_of_issue
      label: Год выпуска
      type: integer
      required: true
      filterable: true
      unit: null
      position: 6

    - key: condition
      label: Состояние
      type: enumerate
      required: true
      filterable: true
      unit: null
      options:
        - {key: new, label: Новый}
        - {key: used, label: Б/У}
      position: 7

    - key: color
      label: Цвет
      type: reference
      required: false
      filterable: false
      unit: null
      source: colors
      position: 8

    - key: country
      label: Страна производства
      type: reference
      required: false
      filterable: false
      unit: null
      source: countries
      position: 9

  categories:
    - name: Тракторы
      subcategories:
        - name: Колесные тракторы
          attributes:
            - key: engine_power
              label: Мощность двигателя
              type: integer
              required: true
              filterable: true
              unit: {key: hp, label: л.с}
              options: null
              position: 0

            - key: fuel_type
              label: Тип топлива
              type: enumerate
              required: false
              filterable: false
              unit: null
              options:
                - {key: gasoline, label: Бензин}
                - {key: diesel, label: Дизель}
                - {key: gas, label: Газ}
                - {key: hybrid, label: Гибрид}
              position: 1

            - key: transmission_type
              label: Тип КПП
              type: enumerate
              required: false
              filterable: false
              unit: null
              options:
                - {key: manual, label: Механика}
                - {key: automatic, label: Автомат}
              position: 2

            - key: drive_type
              label: Тип привода
              type: enumerate
              required: false
              filterable: false
              unit: null
              options:
                - {key: front, label: Передний привод}
                - {key: rear, label: Задний привод}
                - {key: full, label: Полный привод}
              position: 3

            - key: torque
              label: Крутящий момент
              type: integer
              required: false
              filterable: false
              unit: {key: nm, label: Нм}
              options: null
              position: 4

            - key: engine_volume
              label: Объём двигателя
              type: float
              required: false
              filterable: false
              unit: {key: l, label: л}
              options: null
              position: 5

        - name: Гусеничные тракторы
          attributes:
            - key: engine_power
