services:
  bloom-init:
    build: .
    command: python -m scripts.bloom.generate_bloom
    env_file: .env
    entrypoint: [ ]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      bloom-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis

  worker:
    build: .
    restart: always
    env_file: .env
    command: python -m arq src.workers.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis