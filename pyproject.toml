[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
black = "^25.1.0"
flake8 = "^7.3.0"
pytest-asyncio = "^1.1.0"
isort = "^6.0.1"
mypy = "^1.17.1"
coverage = "^7.10.3"

