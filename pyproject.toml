requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[all] (>=0.116.1,<0.117.0)",
    "sqlalchemy[asyncio] (>=2.0.43,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "dependency-injector (>=4.48.1,<5.0.0)",
    "phonenumbers (>=9.0.12,<10.0.0)",
    "bcrypt (>=4.3.0,<5.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "sendgrid (>=6.12.5,<7.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "fastapi-filter[sqlalchemy] (>=2.0.1,<3.0.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "arq (>=0.27.0,<0.28.0)",
    "redis (>=5.3.1,<6.0.0)",
    "resend (>=2.27.0,<3.0.0)",
    "scalar-fastapi (>=1.8.2,<2.0.0)",
    "cloc (>=0.2.5,<0.3.0)",
    "rbloom (>=1.5.4,<2.0.0)",
