name: Continuous Deployment

on:
  push:
    branches:
      - main
      - development

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=production-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/sievers-kz/sievers-market-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/sievers-kz/sievers-market-backend:${{ github.ref_name == 'main' && 'production-latest' || 'staging-latest'}}

  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging'}}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'staging'}}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-generate .env via jq
        env:
          RAW_VARS: ${{ toJSON(vars) }}
          RAW_SECRETS: ${{ toJSON(secrets) }}

          _SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          _SUPER_ADMIN_PASS: ${{ secrets.SUPER_ADMIN_PASS }}
          _SUPER_ADMIN_LAST_NAME: ${{ secrets.SUPER_ADMIN_LAST_NAME }}
          _SUPER_ADMIN_FIRST_NAME: ${{ secrets.SUPER_ADMIN_FIRST_NAME }}

        run: |
          echo "$RAW_VARS" | jq -r 'to_entries | .[] | select(.key | startswith("DEPLOY_") | not) | "\(.key)=\(.value)"' > .env
          echo "$RAW_SECRETS" | jq -r 'to_entries | .[] | select(.key | startswith("DEPLOY_") | not) | "\(.key)=\(.value)"' >> .env
          echo "IMAGE_TAG=${{ github.ref_name == 'main' && 'production-latest' || 'staging-latest'}}" >> .env

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-bundle
          cp docker-compose.yml Makefile deploy-bundle/
          cp -r infra deploy-bundle/

      - name: Copy files and .env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy-bundle/*,.env"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1
          rm: false

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            make deploy MODE=${{ vars.MODE }}
            docker image prune -af --filter "until=24h"
            sudo /usr/local/bin/deploy-nginx.sh ${{ vars.DEPLOY_PATH }}
