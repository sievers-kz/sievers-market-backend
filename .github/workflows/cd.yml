name: Continuous Deployment

on:
  push:
    branches:
      - main
      - development

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=production-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/sievers-kz/sievers-market-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/sievers-kz/sievers-market-backend:${{ github.ref_name == 'main' && 'production-latest' || 'staging-latest'}}

  trigger-deploy:
    name: Trigger deploy in infra
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch infra workflow
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging'}}
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          gh workflow run market-backend-deploy.yml \
          --repo sievers-kz/sievers-infra \
          --ref main \
          -f environment="$TARGET" \
          -f tag="$TAG"
