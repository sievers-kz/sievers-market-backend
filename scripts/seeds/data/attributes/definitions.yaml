- key: brand
  label: Марка
  type: reference
  source: brand

- key: model
  label: Модель
  type: string

- key: year_of_issue
  label: Год выпуска
  type: integer

- key: condition
  label: Состояние
  type: enumerate
  options:
    - {key: new, label: Новый}
    - {key: used, label: Б/У}

- key: color
  label: Цвет
  type: reference
  source: color

- key: country
  label: Страна производства
  type: reference
  source: country

- key: engine_power
  label: Мощность двигателя
  type: integer

- key: fuel_type
  label: Тип топлива
  type: enumerate
  options:
    - {key: gasoline, label: Бензин}
    - {key: diesel, label: Дизель}
    - {key: gas, label: Газ}
    - {key: hybrid, label: Гибрид}

- key: transmission_type
  label: Тип КПП
  type: enumerate
  options:
    - {key: manual, label: Механика}
    - {key: automatic, label: Автомат}

- key: drive_type
